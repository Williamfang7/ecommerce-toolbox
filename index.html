<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商利润计算器</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f0f4f8;
            border-radius: 12px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .profit {
            font-size: 24px;
            font-weight: bold;
        }
        .diagnosis {
    margin-top: 20px;
    padding: 20px;
    background: #fafafa;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
}

.diagnosis h2 {
    margin: 0 0 15px;
    font-size: 20px;
}

.diagnosis-status {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.diagnosis-text {
    line-height: 1.6;
    color: #555;
    margin-bottom: 12px;
}

.diagnosis-advice {
    line-height: 1.8;
    color: #333;
}
    </style>
</head>

<body>

<div class="container">

    <h1>💰 我的电商利润计算器</h1>

    <div class="input-group">
        <label>商品售价（元）</label>
        <input type="number" id="price" value="99">
    </div>

    <div class="input-group">
        <label>采购成本（元）</label>
        <input type="number" id="cost" value="35">
    </div>

    <div class="input-group">
        <label>平台佣金（%）</label>
        <input type="number" id="commission" value="5">
    </div>

    <div class="input-group">
        <label>广告费用（元）</label>
        <input type="number" id="adCost" value="10">
    </div>

    <div class="input-group">
        <label>物流成本（元）</label>
        <input type="number" id="shipping" value="8">
    </div>

    <div class="input-group">
        <label>其他成本（元）</label>
        <input type="number" id="otherCost" value="2">
    </div>
    
    <div class="input-group">
    <label>平均点击成本 CPC（元）</label>
    <input type="number" id="cpc" value="1.5" step="0.01">
</div>
    
    <div class="input-group">
    <label>退款率（%）</label>
    <input type="number" id="refundRate" value="10">
</div>

<div class="input-group">
    <label>税费（元）</label>
    <input type="number" id="tax" value="0">
</div>

    <button onclick="calculateProfit()">计算利润</button>

    <div class="result">

        <div class="result-row">
            <span>平台佣金</span>
            <span id="commissionResult">¥0.00</span>
        </div>

        <div class="result-row">
    <span>预计退款损失</span>
    <span id="refundLoss">¥0.00</span>
             </div>


        <div class="result-row">
            <span>总成本</span>
            <span id="totalCost">¥0.00</span>
        </div>

        <div class="result-row">
            <span>实际利润</span>
            <span class="profit" id="profit">¥0.00</span>
        </div>

        <div class="result-row">
            <span>利润率</span>
            <span id="margin">0%</span>
        </div>
            <div class="result-row">
    <span>实际 ROI</span>
    <span id="actualROI">0</span>
</div>

<div class="result-row">
    <span>保本售价</span>
    <span id="breakEvenPrice">¥0.00</span>
</div>

<div class="result-row">
    <span>保本 CAC</span>
    <span id="breakEvenCAC">¥0.00</span>
</div>

<div class="result-row">
    <span>保本 ROI</span>
    <span id="breakEvenROI">0</span>
</div>

<div class="result-row">
    <span>保本 CVR</span>
    <span id="breakEvenCVR">0%</span>
</div>

        <div class="diagnosis" id="diagnosis">
            <h2>📊 盈利诊断</h2>

            <div class="diagnosis-status" id="diagnosisStatus">
                🟢 正在分析...
            </div>

            <div class="diagnosis-text" id="diagnosisText">
                输入数据后，系统会自动分析你的盈利情况。
            </div>

            <div class="diagnosis-advice" id="diagnosisAdvice">
            </div>
        </div>

    </div>

<script>
function calculateProfit() {

    const price = Number(document.getElementById("price").value);
    const cost = Number(document.getElementById("cost").value);
    const commissionRate = Number(document.getElementById("commission").value);
    const adCost = Number(document.getElementById("adCost").value);
    const shipping = Number(document.getElementById("shipping").value);
    const otherCost = Number(document.getElementById("otherCost").value);
    const refundRate = Number(document.getElementById("refundRate").value);
    const tax = Number(document.getElementById("tax").value);
    const cpc = Number(document.getElementById("cpc").value);

    const commission = price * commissionRate / 100;
    const refundLoss = price * refundRate / 100;
    const breakEvenCAC =
    price -
    cost -
    commission -
    shipping -
    otherCost -
    refundLoss -
    tax;
    const breakEvenROI =
    breakEvenCAC > 0
        ? price / breakEvenCAC
        : 0;
    const breakEvenCVR =
    breakEvenCAC > 0
        ? cpc / breakEvenCAC * 100
        : 0;
    const actualROI =
    adCost > 0
        ? price / adCost
        : 0;
    const fixedCost =
    cost +
    shipping +
    otherCost +
    tax;

const breakEvenPrice =
    (fixedCost + adCost) /
    (1 - commissionRate / 100 - refundRate / 100);

   const totalCost =
    cost +
    commission +
    adCost +
    shipping +
    otherCost +
    refundLoss +
    tax;

    const profit = price - totalCost;

    const margin = price === 0
        ? 0
        : profit / price * 100;

    document.getElementById("commissionResult").textContent =
        "¥" + commission.toFixed(2);
    
    document.getElementById("refundLoss").textContent =
    "¥" + refundLoss.toFixed(2);

    document.getElementById("totalCost").textContent =
        "¥" + totalCost.toFixed(2);

    document.getElementById("profit").textContent =
        "¥" + profit.toFixed(2);

    document.getElementById("margin").textContent =
        margin.toFixed(2) + "%";
    document.getElementById("actualROI").textContent =
    actualROI.toFixed(2);

document.getElementById("breakEvenPrice").textContent =
    "¥" + breakEvenPrice.toFixed(2);

document.getElementById("breakEvenCAC").textContent =
    "¥" + breakEvenCAC.toFixed(2);

document.getElementById("breakEvenROI").textContent =
    breakEvenROI.toFixed(2);

document.getElementById("breakEvenCVR").textContent =
    breakEvenCVR.toFixed(2) + "%";
        // =========================
    // 盈利诊断
    // =========================

    let diagnosisStatus = "";
    let diagnosisText = "";
    let diagnosisAdvice = "";

    if (profit < 0) {

        diagnosisStatus = "🔴 当前处于亏损状态";

        diagnosisText =
            "目前每卖出一件商品都会产生亏损，建议暂时不要扩大广告投入。";

        diagnosisAdvice =
            "💡 建议优先检查：商品售价、采购成本、广告费用以及退款率。";

    } else if (margin < 10) {

        diagnosisStatus = "🟠 盈利能力较弱";

        diagnosisText =
            "当前虽然盈利，但利润空间比较薄，广告成本或退款率稍有上升就可能进入亏损。";

        diagnosisAdvice =
            "💡 建议重点优化采购成本和广告成本，提高单品利润空间。";

    } else if (margin < 20) {

        diagnosisStatus = "🟡 盈利能力一般";

        diagnosisText =
            "当前产品具备盈利能力，但利润率还有进一步提升空间。";

        diagnosisAdvice =
            "💡 建议从降低采购成本、优化广告投放和降低退款率三个方向进行优化。";

    } else if (margin < 30) {

        diagnosisStatus = "🟢 盈利状态健康";

        diagnosisText =
            "当前利润率较为健康，产品具备一定的盈利空间。";

        diagnosisAdvice =
            "💡 可以继续优化广告效率，同时关注退款率和采购成本。";

    } else {

        diagnosisStatus = "🟢 盈利能力优秀";

        diagnosisText =
            "当前产品利润率较高，具备不错的盈利空间。";

        diagnosisAdvice =
            "💡 可以考虑适当扩大广告投入或提高销量，同时保持当前成本结构。";
    }

    // 退款率诊断
    if (refundRate > 10) {
        diagnosisAdvice +=
            "<br>⚠️ 当前退款率为 " +
            refundRate.toFixed(2) +
            "% ，偏高，建议重点优化商品描述、产品质量和售后体验。";
    }

    // 广告成本诊断
    const adRate = price > 0
        ? adCost / price * 100
        : 0;

    if (adRate > 20) {
        diagnosisAdvice +=
            "<br>⚠️ 广告费用占售价 " +
            adRate.toFixed(2) +
            "% ，广告成本偏高，建议优化投放效率。";
    }

    document.getElementById("diagnosisStatus").textContent =
        diagnosisStatus;

    document.getElementById("diagnosisText").textContent =
        diagnosisText;

    document.getElementById("diagnosisAdvice").innerHTML =
        diagnosisAdvice;
}

calculateProfit();
</script>

</body>
</html>
